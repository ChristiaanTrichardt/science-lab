<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0" stop-color="#1d2c4d"/>
      <stop offset=".55" stop-color="#0d1528"/>
      <stop offset="1" stop-color="#060a14"/>
    </radialGradient>
    <linearGradient id="tub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd36e"/>
      <stop offset=".35" stop-color="#ffb347"/>
      <stop offset=".6" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#5fb4ff"/>
    </linearGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#ffb3bd"/>
      <stop offset=".5" stop-color="#ff5d6c"/>
      <stop offset="1" stop-color="#b3213a"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <rect y="250" width="640" height="150" fill="#3a2350" opacity=".28"/>
  <text x="24" y="40" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#e6c8be" opacity=".45">CORTEX</text>
  <text x="24" y="280" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#d7b9e1" opacity=".45">MEDULLA</text>

  <!-- blood vessels -->
  <path d="M40 150 C 90 150, 110 160, 150 165" stroke="#e5484d" stroke-width="12" fill="none" stroke-linecap="round" opacity=".85"/>
  <path d="M150 190 C 110 200, 90 215, 40 215" stroke="#c2304a" stroke-width="9" fill="none" stroke-linecap="round" opacity=".75"/>

  <!-- tubule glow + tubule -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="t" d="M205 205 C 240 225, 262 165, 292 180 S 320 240, 350 210 S 378 150, 398 190 L 398 340 C 398 372, 448 372, 448 340 L 448 205 C 448 170, 482 165, 495 190 S 525 225, 540 190 L 556 150"
      stroke="url(#tub)" stroke-width="22" filter="url(#glow)" opacity=".55"/>
    <path d="M205 205 C 240 225, 262 165, 292 180 S 320 240, 350 210 S 378 150, 398 190 L 398 340 C 398 372, 448 372, 448 340 L 448 205 C 448 170, 482 165, 495 190 S 525 225, 540 190 L 556 150"
      stroke="url(#tub)" stroke-width="15"/>
    <path d="M556 20 L 556 392" stroke="#5fb4ff" stroke-width="19" opacity=".9"/>
    <path d="M556 20 L 556 392" stroke="#cfe6ff" stroke-width="5" opacity=".35"/>
  </g>

  <!-- capsule -->
  <circle cx="180" cy="180" r="56" fill="#c9d6ee" opacity=".08"/>
  <path d="M146 136 A 56 56 0 1 0 220 140" fill="none" stroke="#c9d6ee" stroke-width="11" stroke-linecap="round" opacity=".75"/>

  <!-- glomerulus -->
  <g>
    <circle cx="180" cy="180" r="38" fill="#ff5d6c" filter="url(#glow)" opacity=".5"/>
    <circle cx="166" cy="166" r="15" fill="url(#ball)"/>
    <circle cx="192" cy="164" r="14" fill="url(#ball)"/>
    <circle cx="200" cy="186" r="15" fill="url(#ball)"/>
    <circle cx="178" cy="198" r="16" fill="url(#ball)"/>
    <circle cx="158" cy="188" r="13" fill="url(#ball)"/>
    <circle cx="181" cy="180" r="13" fill="url(#ball)"/>
  </g>

  <!-- particles -->
  <g>
    <circle cx="262" cy="178" r="5" fill="#3ddc97"/><circle cx="276" cy="150" r="4" fill="#3ddc97" opacity=".7"/>
    <circle cx="336" cy="236" r="5" fill="#ff5d8f"/><circle cx="420" cy="290" r="4.5" fill="#5fb4ff"/>
    <circle cx="374" cy="300" r="4" fill="#3ddc97" opacity=".8"/><circle cx="472" cy="230" r="5" fill="#ff5d8f"/>
    <circle cx="520" cy="240" r="4" fill="#5fb4ff" opacity=".8"/><circle cx="230" cy="170" r="4" fill="#ffb347"/>
  </g>
</svg>
