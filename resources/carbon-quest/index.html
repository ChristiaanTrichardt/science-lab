<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carbon Quest: Journey of a Carbon Atom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2242;--ink2:#48507a;--ink3:#7d86a8;
  --glass:rgba(255,255,255,.66);--edge:rgba(255,255,255,.9);
  --accent:#6366f1;
  --shadow:0 18px 44px -18px rgba(30,40,110,.5),0 2px 8px rgba(30,40,110,.08);
  --head:'Fredoka',ui-rounded,'Segoe UI',system-ui,sans-serif;
  --body:'Nunito',ui-rounded,'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--body);color:var(--ink);
  background:linear-gradient(#9fd4ff 0 50%,#3a3348 50%);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hidden{display:none!important}
#world{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);
  border:1px solid var(--edge);box-shadow:var(--shadow),inset 0 1px 0 #fff}

/* world animation */
.cloud{animation:cloud 40s ease-in-out infinite alternate}
.cloud.c2{animation-duration:55s;animation-delay:-20s}
.cloud.c3{animation-duration:48s;animation-delay:-8s}
@keyframes cloud{to{transform:translateX(70px)}}
.floaty{animation:floaty 6s ease-in-out infinite alternate}
@keyframes floaty{to{transform:translate(14px,-12px)}}
.plank{animation:plank 5s ease-in-out infinite alternate}
@keyframes plank{to{transform:translate(8px,10px)}}
.smoke{animation:smoke 5s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:.7}100%{transform:translate(30px,-90px) scale(1.6);opacity:0}}
.waves{animation:waves 6s ease-in-out infinite alternate}
@keyframes waves{to{transform:translateX(-40px)}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.eyes{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.morph{animation:morph .7s cubic-bezier(.3,1.8,.5,1)}
@keyframes morph{0%{transform:scale(1)}35%{transform:scale(1.45)}100%{transform:scale(1)}}
.ring{animation:ring .9s ease-out forwards}
@keyframes ring{from{r:20;opacity:.9}to{r:90;opacity:0}}
@media (prefers-reduced-motion:reduce){.cloud,.floaty,.plank,.smoke,.waves,.bob,.eyes{animation:none}}

/* HUD */
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:999px;z-index:10}
.hud-atom{display:flex;align-items:center;gap:6px;font-family:var(--head);font-weight:600;font-size:1.02rem;padding-right:4px}
.hud-atom svg{width:40px;height:36px;flex:none}
.hud-level{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15;padding-left:4px}
.hud-level small{font-size:.7rem;font-weight:800;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
.hud-level b{font-family:var(--head);font-weight:600;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:5px;padding:0 4px}
.dots i{width:11px;height:11px;border-radius:50%;background:rgba(28,34,66,.14)}
.dots i.done{background:#22c55e}
.dots i.now{background:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.25)}
.chip{height:38px;display:inline-flex;align-items:center;gap:6px;padding:0 13px;border-radius:999px;background:rgba(255,255,255,.85);font-weight:800;font-size:.86rem;white-space:nowrap;border:1px solid var(--edge)}
.chip.form{background:#1c2242;color:#fff;border-color:#1c2242}
.chip.form small{opacity:.6;font-weight:700}
button.chip:hover{background:#fff}
@media (max-width:820px){.dots{display:none}}
@media (max-width:640px){.hud-atom .nm,.chip .lbl,.chip.form small{display:none}.chip{padding:0 10px}}

/* banner + toast */
#banner{position:fixed;top:76px;left:50%;transform:translate(-50%,-20px);opacity:0;z-index:8;padding:12px 26px;border-radius:999px;text-align:center;
  transition:opacity .4s,transform .5s cubic-bezier(.2,1.4,.4,1);pointer-events:none;white-space:nowrap}
#banner.show{opacity:1;transform:translate(-50%,0)}
#banner small{display:block;font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
#banner b{font-family:var(--head);font-weight:600;font-size:1.6rem}
#toast{position:fixed;top:76px;left:50%;transform:translate(-50%,-14px);opacity:0;z-index:30;padding:11px 20px;border-radius:999px;font-weight:800;
  transition:opacity .3s,transform .3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* dialogue */
#dialog{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(780px,calc(100% - 20px));padding:16px 18px 14px;border-radius:28px;display:flex;gap:14px;z-index:9;cursor:pointer;
  animation:rise .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes rise{from{transform:translate(-50%,20px);opacity:0}}
.who{flex:none;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:2.3rem;line-height:1;
  background:radial-gradient(circle at 32% 26%,#fff 0 9%,#eef2ff 30%,#c7d2fe 100%);box-shadow:inset -4px -6px 12px rgba(99,102,241,.25),0 8px 16px -8px rgba(60,70,160,.5)}
.who svg{width:62px;height:56px}
.say{flex:1;min-width:0}
.say-name{font-family:var(--head);font-weight:600;font-size:.98rem;color:var(--accent)}
.say-text{font-size:1.1rem;line-height:1.5;font-weight:700;min-height:3.2em;margin-top:2px}
.say-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.say-foot small{color:var(--ink3);font-weight:700;font-size:.78rem}
@media (max-width:600px){.who{width:50px;height:50px;font-size:1.8rem}.who svg{width:48px;height:44px}.say-text{font-size:1rem}#dialog{padding:14px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;font-weight:800;font-size:1rem;
  background:rgba(255,255,255,.9);border:1px solid var(--edge);box-shadow:0 6px 14px -8px rgba(30,40,110,.4);transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:scale(.97)}
.btn.primary{color:#fff;border-color:transparent;background:radial-gradient(circle at 30% 20%,#a5b4fc 0 8%,#6366f1 60%,#4f46e5 100%);
  box-shadow:0 12px 24px -10px rgba(79,70,229,.8),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.green{color:#fff;border-color:transparent;background:radial-gradient(circle at 30% 20%,#86efac 0 8%,#22c55e 60%,#15803d 100%);box-shadow:0 12px 24px -10px rgba(21,128,61,.8)}
.btn.small{height:38px;padding:0 16px;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}

/* modal cards */
#modal{position:fixed;inset:0;display:grid;place-items:center;padding:16px;z-index:20;background:rgba(20,30,80,.2)}
.card{background:rgba(255,255,255,.84);width:min(640px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;border-radius:30px;padding:24px;animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}}
.card h2{font-family:var(--head);font-weight:600;font-size:1.65rem;line-height:1.15;margin:4px 0 6px;letter-spacing:-.01em}
.card .sub{color:var(--ink2);margin:0 0 16px;font-weight:600}
.kick{font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
@media (max-width:600px){.card{padding:18px;border-radius:24px}.card h2{font-size:1.35rem}}

.qbar{display:flex;gap:6px;margin:10px 0 4px}
.qbar i{flex:1;height:7px;border-radius:9px;background:rgba(28,34,66,.12)}
.qbar i.done{background:#22c55e}.qbar i.now{background:var(--accent)}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.85);border:2px solid rgba(255,255,255,.9);font-weight:700;font-size:1rem;line-height:1.35;
  transition:border-color .2s,background .2s,transform .15s;box-shadow:0 4px 10px -8px rgba(30,40,110,.5)}
.opt:hover:not(:disabled){border-color:#a5b4fc;transform:translateX(3px)}
.opt:disabled{cursor:default}
.opt.right{background:#dcfce7;border-color:#22c55e}
.opt.wrong{background:#ffe4e6;border-color:#fb7185;opacity:.75}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.fb{margin-top:14px;padding:12px 15px;border-radius:16px;font-weight:700;line-height:1.45;animation:pop .3s}
.fb.good{background:#dcfce7;color:#14532d}
.fb.bad{background:#ffe4e6;color:#881337}
.fb.info{background:#e0e7ff;color:#312e81}

/* mini-task parts */
.slots{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:22px;background:rgba(255,255,255,.55);margin-bottom:14px;flex-wrap:wrap}
.slot{width:62px;height:62px;border-radius:50%;border:2.5px dashed #a5b4fc;display:grid;place-items:center;font-size:1.7rem;background:rgba(255,255,255,.6);font-weight:800}
.slot.filled{border-style:solid;border-color:#22c55e;background:#fff;animation:pop .35s}
.slot.txt{font-size:.95rem}
.target{font-size:2.6rem;line-height:1}
.arrow{font-size:1.4rem;color:var(--ink3);font-weight:800}
.tokens{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.token{padding:14px 8px;border-radius:20px;background:rgba(255,255,255,.88);display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:.86rem;line-height:1.2;text-align:center;
  border:2px solid rgba(255,255,255,.9);box-shadow:0 4px 10px -8px rgba(30,40,110,.5);transition:transform .15s,border-color .2s}
.token:hover:not(:disabled){transform:translateY(-3px);border-color:#a5b4fc}
.token .ic{font-size:2.1rem;line-height:1}
.token .ic.f{font-size:1.25rem;font-weight:800;font-family:var(--head);height:2.1rem;display:grid;place-items:center}
.token.used{background:#dcfce7;border-color:#22c55e}
.token.no{background:#ffe4e6;border-color:#fb7185;opacity:.6}
.flip{min-height:150px;padding:16px 12px;justify-content:flex-start}
.flip p{margin:4px 0 0;font-weight:600;font-size:.88rem;color:var(--ink2)}
.flip .tap{color:var(--accent);font-size:.8rem}
@media (max-width:600px){.cards3{grid-template-columns:1fr}.flip{min-height:0;flex-direction:row;text-align:left;gap:12px}.flip .ic{font-size:1.8rem}}
.eq{margin-top:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.75);text-align:center;font-weight:800;font-size:1.02rem}

.range{width:100%;margin:18px 0 6px;accent-color:#6366f1;height:28px}
.rlabels{display:flex;justify-content:space-between;font-size:.8rem;font-weight:800;color:var(--ink3)}
.readout{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:rgba(255,255,255,.7);margin-top:10px}
.readout .big{font-family:var(--head);font-weight:600;font-size:2rem;min-width:94px;text-align:center}
.readout p{margin:0;font-weight:700;line-height:1.4}
.meter{height:12px;border-radius:9px;background:rgba(28,34,66,.1);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#60a5fa,#6366f1);transition:width .2s}
.strata{display:flex;flex-direction:column-reverse;height:150px;border-radius:18px;overflow:hidden;background:#cfe8ff;margin-top:12px;position:relative}
.strata i{display:block;flex:none;height:18px;border-top:1px solid rgba(0,0,0,.08)}
.strata .me{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:1.4rem;transition:all .3s}

.pond{position:relative;height:250px;border-radius:22px;overflow:hidden;background:linear-gradient(#a5e8ff,#3b9fd8 55%,#1e5f9e);
  box-shadow:inset 0 2px 12px rgba(255,255,255,.6)}
.plk{position:absolute;width:46px;height:46px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f7fee7 0 10%,#a3e635 40%,#22c55e 75%,#15803d);
  box-shadow:0 0 16px rgba(163,230,53,.7),inset -3px -4px 8px rgba(21,128,61,.5);animation:drift var(--d) ease-in-out infinite alternate;transition:transform .2s,opacity .2s}
.plk.gone{transform:scale(1.8)!important;opacity:0;pointer-events:none}
@keyframes drift{to{transform:translate(var(--dx),var(--dy))}}
.count{font-family:var(--head);font-weight:600;font-size:1.2rem;margin-top:10px;text-align:center}

/* start screen */
.title{font-family:var(--head);font-weight:600;font-size:clamp(2.2rem,6vw,3.2rem);line-height:1;margin:6px 0 6px;letter-spacing:-.02em}
.title .g{background:linear-gradient(100deg,#16a34a,#0ea5e9 55%,#6366f1);-webkit-background-clip:text;background-clip:text;color:transparent}
.maker{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;margin-top:16px}
@media (max-width:520px){.maker{grid-template-columns:1fr}.preview{margin:0 auto}}
.preview{width:150px;height:140px;border-radius:30px;background:radial-gradient(circle at 50% 40%,#fff,#dbeafe);display:grid;place-items:center;box-shadow:inset 0 0 0 1px #fff}
.preview svg{width:140px;height:122px}
.field label{display:block;font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:10px 0 6px}
.field input{width:100%;height:46px;border-radius:16px;border:2px solid rgba(255,255,255,.95);background:rgba(255,255,255,.9);padding:0 14px;font:inherit;font-weight:800;font-size:1.05rem;color:var(--ink);outline:none}
.field input:focus{border-color:#a5b4fc}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;background:var(--c);box-shadow:inset -3px -4px 8px rgba(0,0,0,.2),inset 2px 3px 6px rgba(255,255,255,.5);border:3px solid #fff}
.sw.on{outline:3px solid var(--c);outline-offset:2px}
.accs{display:flex;gap:6px;flex-wrap:wrap}
.ac{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.85);font-size:1.4rem;display:grid;place-items:center;border:2px solid #fff}
.ac.on{border-color:#6366f1;background:#eef2ff}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.how div{background:rgba(255,255,255,.6);border-radius:16px;padding:10px;font-size:.82rem;font-weight:700;color:var(--ink2);text-align:center;line-height:1.3}
.how b{display:block;font-size:1.4rem}

/* diary */
#diary{position:fixed;top:66px;right:10px;bottom:10px;width:min(340px,calc(100% - 20px));border-radius:26px;padding:18px;z-index:15;overflow:auto;animation:pop .3s}
#diary h3{font-family:var(--head);font-weight:600;font-size:1.3rem;margin:0 0 4px}
.tl{list-style:none;margin:14px 0 0;padding:0;position:relative}
.tl:before{content:'';position:absolute;left:21px;top:10px;bottom:10px;width:3px;border-radius:3px;background:linear-gradient(#a5b4fc,#86efac)}
.tl li{position:relative;display:flex;gap:12px;padding:6px 0}
.tl .ti{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;background:#fff;box-shadow:0 4px 10px -6px rgba(30,40,110,.5);z-index:1}
.tl b{display:block;font-size:.95rem}
.tl span{font-size:.82rem;color:var(--ink2);font-weight:600}
.tl em{font-style:normal;font-size:.72rem;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}

/* finale */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stats div{background:rgba(255,255,255,.75);border-radius:18px;padding:12px;text-align:center;font-weight:700;font-size:.82rem;color:var(--ink2)}
.stats b{display:block;font-family:var(--head);font-weight:600;font-size:1.6rem;color:var(--ink)}
.cert{margin-top:16px;padding:18px;border-radius:22px;text-align:center;border:2px dashed #a5b4fc;background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(224,231,255,.8))}
.cert small{font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-size:.7rem}
.cert h3{font-family:var(--head);font-weight:600;font-size:1.5rem;margin:4px 0}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.paths div{background:rgba(255,255,255,.65);border-radius:14px;padding:10px;font-size:.84rem;font-weight:600;color:var(--ink2);line-height:1.35}
.paths b{color:var(--ink)}
@media (max-width:520px){.paths{grid-template-columns:1fr}}
.confetti{position:fixed;top:-40px;z-index:40;font-size:1.6rem;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
h4.sec{font-family:var(--head);font-weight:600;font-size:1.1rem;margin:18px 0 0}

/* phones */
.hud-level small{white-space:nowrap}
@media (max-width:600px){
  .say-foot small{visibility:hidden}
  .slots{gap:6px;padding:12px 8px;flex-wrap:nowrap}.slot{width:46px;height:46px;font-size:1.3rem;flex:none}.slot.txt{font-size:.8rem}
  .arrow{font-size:1rem}.target{font-size:1.9rem}
  .tokens{gap:8px}.token{padding:12px 4px;font-size:.8rem}.token .ic{font-size:1.8rem}
}
</style>
</head>
<body>

<svg id="world" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" aria-label="Illustrated Earth showing the carbon cycle">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ccbff"/><stop offset=".6" stop-color="#cdeaff"/><stop offset="1" stop-color="#f1faff"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#67d0f3"/><stop offset=".45" stop-color="#2b8bd0"/><stop offset="1" stop-color="#103b74"/></linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a06e48"/><stop offset="1" stop-color="#6b4630"/></linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d708c"/><stop offset="1" stop-color="#352e43"/></linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6d3a3"/><stop offset="1" stop-color="#b89c6a"/></linearGradient>
    <radialGradient id="sunG" cx="40%" cy="35%"><stop offset="0" stop-color="#fffbd6"/><stop offset=".5" stop-color="#ffd84a"/><stop offset="1" stop-color="#ffae1a"/></radialGradient>
    <radialGradient id="glowG"><stop offset="0" stop-color="#fff3a8" stop-opacity=".9"/><stop offset="1" stop-color="#fff3a8" stop-opacity="0"/></radialGradient>
    <radialGradient id="cG" cx="35%" cy="30%"><stop offset="0" stop-color="#737a90"/><stop offset=".55" stop-color="#3a3f52"/><stop offset="1" stop-color="#1b1e2b"/></radialGradient>
    <radialGradient id="oG" cx="35%" cy="30%"><stop offset="0" stop-color="#ffc2c2"/><stop offset=".6" stop-color="#ef4444"/><stop offset="1" stop-color="#a81c1c"/></radialGradient>
    <radialGradient id="oilG" cx="40%" cy="35%"><stop offset="0" stop-color="#4a3b5e"/><stop offset="1" stop-color="#0f0b16"/></radialGradient>
    <radialGradient id="leafG" cx="40%" cy="30%"><stop offset="0" stop-color="#7ee08a"/><stop offset="1" stop-color="#2f9e4f"/></radialGradient>
    <radialGradient id="leafG2" cx="40%" cy="30%"><stop offset="0" stop-color="#9ae6a3"/><stop offset="1" stop-color="#3cae5d"/></radialGradient>
    <radialGradient id="plkG" cx="35%" cy="30%"><stop offset="0" stop-color="#f7fee7"/><stop offset=".5" stop-color="#a3e635"/><stop offset="1" stop-color="#15803d"/></radialGradient>
    <radialGradient id="lavaG"><stop offset="0" stop-color="#fff1a8"/><stop offset=".5" stop-color="#ff8a1f"/><stop offset="1" stop-color="#e0301e" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="480" fill="url(#sky)"/>
  <g transform="translate(250 105)">
    <circle r="140" fill="url(#glowG)"/>

const VB = {x:0, y:0, w:1600, h:1000};
function setVB(){ svg.setAttribute('viewBox', `${VB.x} ${VB.y} ${VB.w} ${VB.h}`); }
function camRect(cx, cy, Wd){
  const a = innerWidth > 0 && innerHeight > 0 ? innerWidth / innerHeight : 1.6;
  const w = Math.min(1600, Wd * Math.min(1.15, Math.max(.55, a / 1.6)));
  const h = w / a;
  let x = cx - w / 2, y = cy - h * .42;
  x = w >= 1600 ? (1600 - w) / 2 : Math.min(Math.max(0, x), 1600 - w);
  y = h >= 1000 ? (1000 - h) / 2 : Math.min(Math.max(0, y), 1000 - h);
  return {x, y, w, h};
}
const ease = k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
let camTarget = {cx:800, cy:500, W:1600};
function tweenCam(cx, cy, W, dur){
  camTarget = {cx, cy, W};
  const t = camRect(cx, cy, W), f = {...VB};
  dur = REDUCED ? 1 : (dur || 1100);
  return new Promise(res => {
    const t0 = performance.now();
    (function step(now){
      const k = ease(Math.min(1, (now - t0) / dur));
      VB.x = f.x + (t.x - f.x) * k; VB.y = f.y + (t.y - f.y) * k; VB.w = f.w + (t.w - f.w) * k; VB.h = f.h + (t.h - f.h) * k;
      setVB();
      k < 1 ? requestAnimationFrame(step) : res();
    })(performance.now());
  });
}
addEventListener('resize', () => { Object.assign(VB, camRect(camTarget.cx, camTarget.cy, camTarget.W)); setVB(); });

function moveAtom(to, via, dur){
  const a = [pos.x, pos.y], c = via || [(a[0]+to[0])/2, Math.min(a[1], to[1]) - 120];
  dur = REDUCED ? 1 : (dur || 1800);
  return new Promise(res => {
    const t0 = performance.now();
    (function step(now){
      const k = ease(Math.min(1, (now - t0) / dur)), u = 1 - k;
      placeAtom([u*u*a[0] + 2*u*k*c[0] + k*k*to[0], u*u*a[1] + 2*u*k*c[1] + k*k*to[1]]);
      k < 1 ? requestAnimationFrame(step) : res();
    })(performance.now());
  });
}
async function travel(to, via, msg){
  if (Math.hypot(to[0] - pos.x, to[1] - pos.y) < 5) { toast(msg, 2600); await wait(REDUCED ? 300 : 1400); return; }
  const xs = [pos.x, to[0], via[0]], ys = [pos.y, to[1], via[1]];
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  const W = Math.max(760, (Math.max(...xs) - Math.min(...xs)) * 1.5, (Math.max(...ys) - Math.min(...ys)) * 2.2);
  toast(msg, 3200);
  await tweenCam(cx, cy + 60, W, 900);
  await moveAtom(to, via, 2000);
}

function runTask(t){ return ({combine:taskCombine, cards:taskCards, order:taskOrder, find:taskFind, slider:taskSlider, catch:taskCatch})[t.type](t); }

function taskCombine(t){ return new Promise(res => {
  const toks = shuffle(t.tokens);
  const c = card(head('🧪 Mini-task', t.title, t.prompt) +
    `<div class="slots"><span class="target">${t.target}</span><span class="arrow">⟵</span>${'<span class="slot"></span>'.repeat(t.need)}</div>
     <div class="tokens">${toks.map((k, i) => `<button class="token" data-i="${i}">${tokenIc(k)}${esc(k.label)}</button>`).join('')}</div>
     <div class="fb hidden"></div><div class="actions"><button class="btn green hidden" id="go">${t.done}</button></div>`);
  let n = 0;
  c.querySelector('.tokens').addEventListener('click', e => {
    const b = e.target.closest('.token'); if (!b || b.disabled) return;
    const k = toks[+b.dataset.i];
    if (k.ok) {
      b.disabled = true; b.classList.add('used');
      const s = c.querySelectorAll('.slot')[n++]; s.innerHTML = k.ic; s.classList.add('filled'); if (k.f) s.classList.add('txt');
      if (n === t.need) {
        c.querySelectorAll('.token').forEach(x => x.disabled = true);
        feedback(c, 'good', `✓ Perfect!<div class="eq">${t.result}</div>`);
        c.querySelector('#go').classList.remove('hidden');
      } else feedback(c, 'good', `✓ Yes! ${t.need - n} more to go.`);
    } else { shake(b); feedback(c, 'bad', '✗ ' + k.why); }
  });
  c.querySelector('#go').addEventListener('click', () => { closeCard(); res(); });
}); }

function taskCards(t){ return new Promise(res => {
  const c = card(head('🧪 Mini-task', t.title, t.prompt) +
    `<div class="tokens cards3">${t.cards.map((k, i) => `<button class="token flip" data-i="${i}"><span class="ic">${k.ic}</span><div><b>${k.t}</b><p class="tap">Tap to reveal</p></div></button>`).join('')}</div>
     <div class="actions"><button class="btn green hidden" id="go">${t.done}</button></div>`);
  const seen = new Set();
  c.querySelector('.tokens').addEventListener('click', e => {
    const b = e.target.closest('.token'); if (!b || seen.has(b.dataset.i)) return;
    const k = t.cards[+b.dataset.i]; seen.add(b.dataset.i);
    b.classList.add('used'); b.querySelector('div').innerHTML = `<b>${k.t}</b><p>${k.d}</p>`;
    if (seen.size === t.cards.length) c.querySelector('#go').classList.remove('hidden');
  });
  c.querySelector('#go').addEventListener('click', () => { closeCard(); res(); });
}); }

function taskOrder(t){ return new Promise(res => {
  const items = t.items.map((k, i) => ({...k, i})), mixed = shuffle(items);
  const c = card(head('🧪 Mini-task', t.title, t.prompt) +
    `<div class="slots">${items.map((_, i) => `${i ? '<span class="arrow">→</span>' : ''}<span class="slot"></span>`).join('')}</div>
     <div class="tokens" style="grid-template-columns:repeat(4,1fr)">${mixed.map(k => `<button class="token" data-i="${k.i}"><span class="ic">${k.ic}</span>${esc(k.label)}</button>`).join('')}</div>
     <div class="fb hidden"></div><div class="actions"><button class="btn green hidden" id="go">${t.done}</button></div>`);
  let n = 0;
  c.querySelector('.tokens').addEventListener('click', e => {
    const b = e.target.closest('.token'); if (!b || b.disabled) return;
    if (+b.dataset.i === n) {
      b.disabled = true; b.classList.add('used');
      const s = c.querySelectorAll('.slot')[n++]; s.textContent = t.items[+b.dataset.i].ic; s.classList.add('filled');
      if (n === items.length) { feedback(c, 'good', `✓ That's a food chain! <div class="eq">${t.result}</div>`); c.querySelector('#go').classList.remove('hidden'); }
      else feedback(c, 'good', '✓ Good, what comes next?');
    } else { shake(b); feedback(c, 'bad', '✗ Not that one yet. ' + t.hint); }
  });
  c.querySelector('#go').addEventListener('click', () => { closeCard(); res(); });
}); }

function taskFind(t){ return new Promise(res => {
  const items = shuffle(t.items);
  const c = card(head('🔎 Mini-task', t.title, t.prompt) +
    `<div class="tokens">${items.map((k, i) => `<button class="token" data-i="${i}">${tokenIc(k)}${esc(k.label)}</button>`).join('')}</div>
     <div class="fb hidden"></div><div class="actions"><button class="btn green hidden" id="go">${t.done}</button></div>`);
  let n = 0;
  c.querySelector('.tokens').addEventListener('click', e => {
    const b = e.target.closest('.token'); if (!b || b.disabled) return;
    const k = items[+b.dataset.i];
    if (k.ok) {
      b.disabled = true; b.classList.add('used'); n++;
      feedback(c, 'good', `✓ ${k.say}${n < t.need ? ` <b>${t.need - n} more to find.</b>` : ''}`);
      if (n === t.need) { c.querySelectorAll('.token').forEach(x => x.disabled = true); c.querySelector('#go').classList.remove('hidden'); }
    } else { shake(b); b.classList.add('no'); b.disabled = true; feedback(c, 'bad', '✗ ' + k.why); }
  });
  c.querySelector('#go').addEventListener('click', () => { closeCard(); res(); });
}); }

const TIME_STAGES = [
  [0,   '🟢', 'Fresh dead plankton settles on the sea floor.'],
  [30,  '🟤', 'Buried under new layers of mud and sand.'],
  [90,  '🟠', 'Squashed and heated deeper underground. No oxygen, so no decomposers!'],
  [170, '🟣', 'Slowly "cooking" into tiny drops of oil.'],
  [300, '🛢️', 'You are now part of CRUDE OIL, a fossil fuel!']
];
function sliderView(kind, v){
  if (kind === 'temp') {
    const pct = Math.round(Math.max(6, 100 - v * 3.1));
    const msg = v <= 8 ? '🥶 Brrr, perfect! Cold water is soaking you right up.'
      : v <= 18 ? '😐 Some CO₂ dissolves… but you keep bubbling back out.'
      : '🥵 Too warm! You keep escaping, like a warm fizzy drink going flat.';
    const col = v <= 8 ? '#3b82f6' : v <= 18 ? '#a855f7' : '#f97316';
    return {ok: v <= 8, html:`<div class="readout"><div class="big" style="color:${col}">${v}°C</div><div style="flex:1"><p>${msg}</p>
      <div class="meter"><i style="width:${pct}%"></i></div><p style="font-size:.8rem;color:var(--ink3);margin-top:4px">How much CO₂ the water can hold: ${pct}%</p></div></div>`};
  }
  let st = TIME_STAGES[0]; TIME_STAGES.forEach(s => { if (v >= s[0]) st = s; });
  const layers = 1 + Math.floor(v / 38), temp = Math.round(4 + v * .5);
  const cols = ['#e6d3a3','#cdb789','#b89c6a','#9f8458','#8a6f49','#78603f','#6b5436','#5e4a30','#52412b'];
  return {ok: v >= 300, html:`<div class="readout"><div class="big">${v}<small style="font-size:.9rem;display:block">million yrs</small></div><div><p>${st[2]}</p>
    <p style="font-size:.82rem;color:var(--ink3);margin-top:4px">🌡️ ${temp}°C · ⬇️ pressure ${'▮'.repeat(Math.min(9, layers))}</p></div></div>
    <div class="strata">${Array.from({length:9}, (_, i) => `<i style="background:${i < layers ? cols[i] : 'transparent'}"></i>`).join('')}<span class="me">${st[1]}</span></div>`};
}
function taskSlider(t){ return new Promise(res => {
  const c = card(head('🧪 Mini-task', t.title, t.prompt) +
    `<input class="range" type="range" min="${t.min}" max="${t.max}" value="${t.start}" step="1" aria-label="${esc(t.title)}">
     <div class="rlabels">${t.kind === 'temp' ? '<span>🧊 0°C polar</span><span>30°C tropical 🌴</span>' : '<span>Today</span><span>300 million years</span>'}</div>
     <div id="view"></div><div class="actions"><button class="btn green" id="go" disabled>${t.done}</button></div>`);
  const r = c.querySelector('.range');
  const upd = () => { const v = sliderView(t.kind, +r.value); c.querySelector('#view').innerHTML = v.html; c.querySelector('#go').disabled = !v.ok; };
  r.addEventListener('input', upd); upd();
  c.querySelector('#go').addEventListener('click', () => { closeCard(); res(); });
}); }

function taskCatch(t){ return new Promise(res => {
  const c = card(head('🎯 Mini-task', t.title, t.prompt) + `<div class="pond"></div><div class="count">🟢 0 / ${t.count}</div>
    <div class="actions"><button class="btn green hidden" id="go">${t.done}</button></div>`);
  const pond = c.querySelector('.pond'); let n = 0, over = false;
  const spawn = () => {
    const p = document.createElement('button'); p.className = 'plk'; p.setAttribute('aria-label', 'Phytoplankton');
    p.style.cssText = `left:${5 + Math.random() * 78}%;top:${8 + Math.random() * 70}%;--dx:${(Math.random() - .5) * 120}px;--dy:${(Math.random() - .5) * 80}px;--d:${1.6 + Math.random() * 2}s`;
    p.addEventListener('click', () => {
      if (over) return; p.classList.add('gone'); n++;
      c.querySelector('.count').textContent = `🟢 ${n} / ${t.count}`;
      setTimeout(() => { p.remove(); if (!over) spawn(); }, 250);
      if (n >= t.count) { over = true; c.querySelector('.count').textContent = '🎉 Absorbed!'; c.querySelector('#go').classList.remove('hidden'); }
    });
    pond.appendChild(p);
  };
  for (let i = 0; i < 6; i++) spawn();
  c.querySelector('#go').addEventListener('click', () => { closeCard(); res(); });
}); }

/* ---------- question gates ---------- */
function askQ(q, meta){ return new Promise(res => {
  const opts = shuffle(q.o.map((t, i) => ({t, ok: i === 0})));
  const bar = meta.bonus ? '' : `<div class="qbar">${Array.from({length: meta.n}, (_, i) => `<i class="${i < meta.k ? 'done' : i === meta.k ? 'now' : ''}"></i>`).join('')}</div>`;
  const kick = meta.bonus ? '⭐ Bonus challenge · one try only' : `${meta.gateName} · Question ${meta.k + 1} of ${meta.n}`;
  const c = card(`<div class="kick">${kick}</div>${bar}<h2>${esc(q.q)}</h2>
    <div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o.t)}</button>`).join('')}</div>
    <div class="fb hidden"></div><div class="actions"><button class="btn primary hidden" id="go">${meta.last ? 'Unlock! 🔓' : 'Next ▸'}</button></div>`);
  let tries = 0;
  c.querySelector('.opts').addEventListener('click', e => {
    const b = e.target.closest('.opt'); if (!b || b.disabled) return;
    const o = opts[+b.dataset.i]; tries++;
    const lock = () => c.querySelectorAll('.opt').forEach((x, i) => { x.disabled = true; if (opts[i].ok) x.classList.add('right'); });
    if (meta.bonus) {
      lock(); if (!o.ok) b.classList.add('wrong');
      if (o.ok) { state.stars++; save(); hud(); }
      feedback(c, o.ok ? 'good' : 'info', (o.ok ? '⭐ Correct, you earned a star! ' : '💡 Good try! ') + esc(q.ex));
      c.querySelector('#go').classList.remove('hidden');
    } else if (o.ok) {
      if (tries === 1) state.first++;
      state.asked++; save();
      lock();
      feedback(c, 'good', '✓ ' + esc(q.ex));
      c.querySelector('#go').classList.remove('hidden');
      c.querySelector('#go').focus();
    } else {
      b.disabled = true; b.classList.add('wrong'); shake(b);
      feedback(c, 'bad', '✗ Not quite. 💡 ' + esc(q.hint) + ' Try again!');
    }
  });
  c.querySelector('#go').addEventListener('click', () => { closeCard(); res(); });
}); }

function choose(html, a, b){ return new Promise(res => {
  const c = card(html + `<div class="actions"><button class="btn" id="b">${b}</button><button class="btn primary" id="a">${a}</button></div>`);
  c.querySelector('#a').addEventListener('click', () => { closeCard(); res(true); });
  c.querySelector('#b').addEventListener('click', () => { closeCard(); res(false); });
}); }

/* ---------- main flow ---------- */
async function playLevel(i){
  const L = LEVELS[i];
  state.level = i; save(); hud();
  placeAtom(L.anchor); drawAtom();
  $('#rabbit').style.opacity = i === 3 ? 0 : 1; // Bun has returned to the soil on the forest floor level
  await tweenCam(L.anchor[0], L.anchor[1], L.zoom, 1200);
  await banner(i);
  let again = true;
  while (again) {
    await say(L.speaker, L.intro);
    await runTask(L.task);
    if (state.diary.length <= i + 1) setForm(L.formAfter, L.diary); else { state.form = L.formAfter; drawAtom(); hud(); }
    if (L.moveAfter) {
      await Promise.all([
        moveAtom(L.moveAfter, [L.anchor[0] + 20, (L.anchor[1] + L.moveAfter[1]) / 2], 1600),
        tweenCam(L.moveAfter[0], L.moveAfter[1], L.zoom, 1600)
      ]);
    }
    await say(L.speaker, L.outro);
    // "Hear the story again" replays the level before the questions
    again = !(await gateReady(i));
    if (again) { state.form = i ? LEVELS[i - 1].formAfter : 'CO₂'; placeAtom(L.anchor); drawAtom(); hud(); }
  }
  await runGateQuestions(i);
  state.level = i + 1; save();
  if (i < LEVELS.length - 1) {
    const ok = await choose(head('🔓 Unlocked!', `Level ${i + 2}: ${LEVELS[i + 1].icon} ${LEVELS[i + 1].place}`, 'Gate open! Your atom is ready for the next part of its journey.'), 'Travel there ▸', 'Open diary');
    if (!ok) { openDiary(); await waitDiaryClose(); }
    await travel(LEVELS[i + 1].anchor, L.via, L.travel);
    playLevel(i + 1);
  } else {
    state.done = true; save(); hud();
    await travel(SKY, L.via, L.travel);
    finale();
  }
}
// split gate so "Hear it again" can replay the story before the questions
function gateReady(i){
  const L = LEVELS[i], last = i === LEVELS.length - 1;
  return choose(head(last ? '🔒 Final gate' : `🔒 Gate to Level ${i + 2}`, last ? 'One last gate!' : `Unlock: ${LEVELS[i + 1].icon} ${LEVELS[i + 1].place}`,
    `Answer ${L.gate.length} questions correctly to ${last ? 'finish your journey' : 'move on'}. Get one wrong? Read the hint and try again.`), "I'm ready! 🔓", '↺ Hear the story again');
}
async function runGateQuestions(i){
  const L = LEVELS[i], last = i === LEVELS.length - 1;
  const gateName = last ? '🔒 Final gate' : `🔒 Gate to Level ${i + 2}`;
  for (let k = 0; k < L.gate.length; k++) await askQ(L.gate[k], {k, n: L.gate.length, gateName, last: false});
  const tryIt = await choose(head('⭐ Bonus challenge', 'Want to earn a star?', 'This one is a harder extension question. You only get one try, and there\'s no penalty for getting it wrong.'), 'Try it ⭐', 'Skip');
  if (tryIt) await askQ(L.bonus, {bonus: true});
}

/* ---------- diary ---------- */
let diaryClosed = null;
function openDiary(){
  const d = $('#diary');
  d.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><h3>📔 ${esc(state.name)}'s diary</h3><button class="btn small" id="dx">Close</button></div>
    <p class="sub" style="margin:0;color:var(--ink2);font-weight:600;font-size:.9rem">Every form your atom has taken so far.</p>
    <ol class="tl">${state.diary.map((e, k) => `<li><span class="ti">${e.icon}</span><div><em>${k ? 'Stop ' + k : 'Start'} · ${esc(e.process)}</em><b>${esc(e.form)}</b><span>${esc(e.place)}</span></div></li>`).join('')}</ol>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" id="restart">↺ Start a new atom</button></div>`;
  d.classList.remove('hidden');
  d.querySelector('#dx').onclick = closeDiary;
  d.querySelector('#restart').onclick = () => { if (confirm('Start again with a new atom? Your progress will be lost.')) { wipe(); location.reload(); } };
}
function closeDiary(){ $('#diary').classList.add('hidden'); if (diaryClosed) { diaryClosed(); diaryClosed = null; } }
function waitDiaryClose(){ return new Promise(r => diaryClosed = r); }
$('#diaryBtn').addEventListener('click', () => $('#diary').classList.contains('hidden') ? openDiary() : closeDiary());

/* ---------- finale ---------- */
function confetti(){
  if (REDUCED) return;
  const bits = ['🎉','✨','🌿','💨','🌊','⭐','🟢','🍃'];
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('span'); s.className = 'confetti'; s.textContent = bits[i % bits.length];
    s.style.cssText = `left:${Math.random() * 100}vw;animation-duration:${2.5 + Math.random() * 2.5}s;animation-delay:${Math.random() * 1.2}s`;
    document.body.appendChild(s); setTimeout(() => s.remove(), 6500);
  }
}
async function finale(){
  hud();
  await tweenCam(800, 500, 1600, 1600);
  confetti();
  const date = new Date().toLocaleDateString(undefined, {day:'numeric', month:'long', year:'numeric'});
  const total = LEVELS.reduce((n, L) => n + L.gate.length, 0);
  const c = card(head('🏁 Journey complete!', `Amazing work, ${esc(state.name)}! 🎉`, 'Your carbon atom travelled all the way around the carbon cycle and ended up back in the atmosphere where it started.') +
    `<div class="stats"><div><b>8 / 8</b>places visited</div><div><b>${state.first} / ${total}</b>right first try</div><div><b>⭐ ${state.stars}</b>bonus stars</div></div>
    <h4 class="sec">Your atom's journey</h4>
    <ol class="tl">${state.diary.map((e, k) => `<li><span class="ti">${e.icon}</span><div><em>${k ? esc(e.process) : 'Start'}</em><b>${esc(e.form)}</b><span>${esc(e.place)}</span></div></li>`).join('')}</ol>
    <h4 class="sec">Other paths a carbon atom could take</h4>
    <div class="paths">
      <div><b>🌋 Volcanoes</b><br>Carbon in rocks deep underground can be released as CO₂ when volcanoes erupt.</div>
      <div><b>🔥 Bushfires</b><br>Burning trees is combustion. It releases carbon from wood straight back into the air.</div>
      <div><b>🪨 Limestone</b><br>Shells can become limestone, storing carbon for millions of years until rocks weather away.</div>
      <div><b>⚡ Shortcut!</b><br>The leaf could have used you for respiration straight away, and you'd be CO₂ again in minutes.</div>
    </div>
    <div class="cert"><small>Certificate of achievement</small><h3>Carbon Cycle Explorer</h3>
      <div style="display:flex;justify-content:center;margin:4px 0"><svg viewBox="-52 -50 104 92" style="width:70px;height:62px">${avatar(state.color, state.acc, state.form)}</svg></div>
      <b>${esc(state.name)}</b><br><span style="color:var(--ink2);font-weight:600;font-size:.9rem">completed Carbon Quest · ${esc(date)}</span></div>
    <div class="actions"><button class="btn" id="diaryEnd">📔 Diary</button><button class="btn primary" id="again">↺ Play again</button></div>`);
  c.querySelector('#again').onclick = () => { wipe(); location.reload(); };
  c.querySelector('#diaryEnd').onclick = () => openDiary();
}

/* ---------- start screen ---------- */
function startScreen(){
  const saved = load();
  let draft = {name: saved ? saved.name : 'Carbie', color: saved ? saved.color : COLORS[0], acc: saved ? saved.acc : 'none'};
  const c = card(`<div class="kick">Mr Trichardt's Science Lab</div>
    <h1 class="title">Carbon <span class="g">Quest</span></h1>
    <p class="sub" style="margin:0">You are a carbon atom. Travel through air, plants, animals, soil, oceans and deep time, and pass the question gates to unlock each level.</p>
    <div class="how"><div><b>🗺️</b>8 levels around the carbon cycle</div><div><b>🧪</b>A mini-task in every level</div><div><b>🔒</b>Answer questions to unlock the next level</div></div>
    ${saved ? `<div class="fb info" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
       <span>Welcome back, <b>${esc(saved.name)}</b>! ${saved.done ? 'You finished the journey.' : `You were up to Level ${saved.level + 1}: ${esc(LEVELS[Math.min(saved.level, 7)].place)}.`}</span>
       <button class="btn primary small" id="cont">${saved.done ? 'See results' : 'Continue ▸'}</button></div>` : ''}
    <div class="maker">
      <div class="preview"><svg id="pv" viewBox="-52 -50 104 92"></svg></div>
      <div class="field">
        <label for="nm">Name your atom</label><input id="nm" maxlength="16" value="${esc(draft.name)}" autocomplete="off">
        <label>Glow colour</label><div class="swatches">${COLORS.map(col => `<button class="sw" data-c="${col}" style="--c:${col}" aria-label="Colour ${col}"></button>`).join('')}</div>
        <label>Accessory</label><div class="accs">${Object.keys(ACCS).map(k => `<button class="ac" data-a="${k}" aria-label="${k}">${ACCS[k].icon}</button>`).join('')}</div>
      </div>
    </div>
    <div class="actions"><button class="btn primary" id="startBtn">${saved ? 'Start a new journey' : 'Start the journey'} ▸</button></div>`);
  const paint = () => {
    c.querySelector('#pv').innerHTML = avatar(draft.color, draft.acc, 'CO₂');
    c.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.c === draft.color));
    c.querySelectorAll('.ac').forEach(b => b.classList.toggle('on', b.dataset.a === draft.acc));
  };
  c.querySelector('.swatches').onclick = e => { const b = e.target.closest('.sw'); if (b) { draft.color = b.dataset.c; paint(); } };
  c.querySelector('.accs').onclick = e => { const b = e.target.closest('.ac'); if (b) { draft.acc = b.dataset.a; paint(); } };
  paint();
  c.querySelector('#startBtn').onclick = () => {
    state = fresh();
    state.name = (c.querySelector('#nm').value.trim() || 'Carbie').slice(0, 16);
    state.color = draft.color; state.acc = draft.acc;
    save(); closeCard(); drawAtom(); hud(); playLevel(0);
  };
  const cont = c.querySelector('#cont');
  if (cont) cont.onclick = () => {
    state = Object.assign(fresh(), saved); closeCard(); drawAtom(); hud();
    if (state.done) { placeAtom(SKY); finale(); } else playLevel(Math.min(state.level, LEVELS.length - 1));
  };
}

/* ---------- boot ---------- */
drawAtom();
Object.assign(VB, camRect(800, 500, 1600)); setVB();
const jump = parseInt(new URLSearchParams(location.search).get('level'), 10);
if (jump >= 1 && jump <= LEVELS.length) {
  // Teacher shortcut: ?level=5 jumps straight to that level
  state = fresh(); state.level = jump - 1;
  for (let k = 0; k < jump - 1; k++) state.diary.push(LEVELS[k].diary);
  state.form = jump > 1 ? LEVELS[jump - 2].formAfter : 'CO₂';
  drawAtom(); hud(); playLevel(jump - 1);
} else startScreen();
})();
</script>
