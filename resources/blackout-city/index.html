<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blackout City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1f;--panel:rgba(16,22,52,.9);--line:rgba(120,140,255,.28);--ink:#eef1ff;--ink2:#a9b1dd;--ink3:#7079a8;
  --volt:#ffd60a;--cyan:#38e1ff;--hot:#ff4d6d;--ok:#4ade80;--head:'Righteous',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hidden{display:none!important}
.sky{position:fixed;inset:0;z-index:-2;background:radial-gradient(1200px 600px at 70% -10%,#22296b,transparent 60%),radial-gradient(900px 500px at 0% 100%,#3b1d5a,transparent 60%),var(--bg)}
.sky i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.7;animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.15}}
@media (prefers-reduced-motion:reduce){.sky i{animation:none}}
.wrap{max-width:1220px;margin:0 auto;padding:14px 16px 60px}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 40px -24px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:999px;position:sticky;top:10px;z-index:10;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-size:1.15rem;cursor:pointer}
.bolt{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff7b0,var(--volt) 55%,#f59e0b);color:#3b2a00;font-size:1.2rem;box-shadow:0 0 18px rgba(255,214,10,.6)}
.top .sp{flex:1}
@media (max-width:560px){.top{border-radius:20px}.brand{font-size:1rem}.bolt{width:32px;height:32px}.chip{height:32px;padding:0 10px;font-size:.78rem}.chip .long{display:none}}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-weight:800;font-size:.86rem;white-space:nowrap}
button.chip:hover{background:rgba(255,255,255,.12)}
.chip.e{border-color:rgba(56,225,255,.6);color:#bff6ff}
.chip.c{border-color:rgba(255,214,10,.6);color:#fff1a8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:14px;font-weight:900;background:rgba(255,255,255,.07);border:1px solid var(--line);transition:transform .12s,filter .2s;white-space:nowrap}
.btn:hover:not(:disabled){filter:brightness(1.2)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.volt{background:linear-gradient(180deg,#ffe45c,#ffc300);color:#2b1d00;border-color:#ffe45c;box-shadow:0 0 22px -4px rgba(255,214,10,.8)}
.btn.small{height:38px;padding:0 14px;font-size:.9rem}
h1,h2,h3{font-family:var(--head);font-weight:400;margin:0}
/* title */
.hero{text-align:center;padding:30px 10px 6px}
.hero h1{font-size:clamp(2.8rem,9vw,5.6rem);line-height:1;letter-spacing:.02em}
.hero h1 .off{color:#2a3166}
.hero h1 .on{color:var(--volt);text-shadow:0 0 18px rgba(255,214,10,.8),0 0 50px rgba(255,214,10,.4)}
.hero p{max-width:660px;margin:12px auto 16px;color:var(--ink2);font-weight:700;font-size:1.05rem}
/* city overview */
.citybox{padding:10px;border-radius:24px;overflow:hidden;position:relative}
.citybox svg{display:block;width:100%;height:auto}
.cityhud{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.meter{display:flex;align-items:center;gap:8px;font-weight:900}
.meter .bar{width:140px;height:12px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.meter .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff4d6d,#ffd60a,#4ade80);transition:width .6s}
.plate{cursor:pointer}
.plate:hover .pl-top{filter:brightness(1.25)}
.plate.lock{cursor:not-allowed;opacity:.55}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.daynight{animation:dn 24s ease-in-out infinite}
@keyframes dn{0%,100%{opacity:.85}50%{opacity:.35}}
.dusk{opacity:.1;animation:dusk 24s ease-in-out infinite}
@keyframes dusk{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.pulse,.daynight,.dusk{animation:none}}
/* game */
.game{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;margin-top:14px;align-items:start}
@media (max-width:920px){.game{grid-template-columns:minmax(0,1fr)}}
.board{padding:6px;border-radius:22px;overflow:hidden}
.board svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.side{display:grid;gap:12px}
.side .glass{padding:14px}
.story h2{font-size:1.4rem}
.story p{margin:6px 0 0;color:var(--ink2);font-weight:700;line-height:1.45}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats2 div{padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:800;font-size:.8rem;color:var(--ink2)}
.stats2 b{display:block;font-family:var(--head);font-weight:400;font-size:1.3rem;color:var(--ink)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tool{padding:10px 4px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.04);font-weight:900;font-size:.82rem;text-align:center}
.tool .e{display:block;font-size:1.5rem}
.tool.on{border-color:var(--volt);background:rgba(255,214,10,.12);box-shadow:0 0 16px -4px rgba(255,214,10,.7)}
.tool small{display:block;color:var(--ink3);font-size:.72rem}
.goals{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.goals li{display:flex;gap:8px;align-items:flex-start;font-weight:800;font-size:.9rem;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.goals li.ok{border-color:rgba(74,222,128,.5);background:rgba(74,222,128,.1)}
.msg{padding:10px 12px;border-radius:12px;font-weight:800;font-size:.9rem;line-height:1.4}
.msg.bad{background:rgba(255,77,109,.14);border:1px solid rgba(255,77,109,.5);color:#ffd1da}
.msg.info{background:rgba(56,225,255,.1);border:1px solid rgba(56,225,255,.4);color:#d2f7ff}
.row{display:flex;gap:8px;flex-wrap:wrap}
/* svg bits */
.cable{stroke:#3b4aa8;stroke-width:9;stroke-linecap:round}
.cable.live{stroke:#5f7cff}
.flow{stroke-width:4;stroke-linecap:round;stroke-dasharray:2 13;fill:none;animation:flow .6s linear infinite}
.flow.e{stroke:#7df9ff}.flow.c{stroke:var(--volt)}
.flow.rev{animation-direction:reverse}
@keyframes flow{to{stroke-dashoffset:-15}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
.hover{stroke:rgba(255,214,10,.5);stroke-width:14;stroke-linecap:round}
.spark{animation:spark .25s steps(2) infinite}
@keyframes spark{50%{opacity:.2}}
.bubble{animation:bub .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes bub{from{opacity:0;transform:translateY(8px)}}
/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(3,5,15,.7)}
.card{max-width:540px;width:100%;padding:24px;border-radius:24px;text-align:center;animation:pop .45s cubic-bezier(.2,1.3,.4,1);max-height:calc(100vh - 32px);overflow:auto}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
.card h2{font-size:2rem;color:var(--volt);text-shadow:0 0 16px rgba(255,214,10,.6)}
.card .stars{font-size:2.6rem;letter-spacing:6px;margin:8px 0}
.card .note{text-align:left;padding:12px 14px;border-radius:14px;background:rgba(56,225,255,.08);border:1px solid rgba(56,225,255,.3);font-weight:700;color:#d2f7ff;line-height:1.5;margin:12px 0}
.card .note b{color:#fff}
/* sprint */
.sprint{max-width:620px;margin:14px auto 0;padding:16px;border-radius:24px}
.shud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.shud .big{font-family:var(--head);font-size:1.6rem}
.shud .t{color:var(--volt)}
.tbar{height:10px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:12px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--hot),var(--volt));transition:width .25s linear}
.tiles{display:grid;gap:4px;margin:0 auto;max-width:520px}
.tile{aspect-ratio:1;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);padding:0;position:relative;overflow:hidden}
.tile svg{width:100%;height:100%;display:block;transition:transform .18s ease}
.tile.lit{background:rgba(255,214,10,.14);border-color:rgba(255,214,10,.6)}
.tile.lit .ln{stroke:var(--volt)}
.ln{stroke:#5b6bd6;stroke-width:16;stroke-linecap:round;fill:none}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="wrap">
  <header class="top glass"><div class="brand" id="home"><span class="bolt">⚡</span>Blackout City</div><span class="sp"></span>
    <button class="chip" id="flowChip" title="Change what the moving dots show"></button><span class="chip" id="starChip">⭐ 0</span></header>
  <main id="main"></main>
</div>
<div class="modal hidden" id="modal"></div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const KEY = 'blackout-city-v2';
let save = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
save.stars = save.stars || {}; save.best = save.best || 0; if (!save.flow) save.flow = 'e';
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };
const totalStars = () => Object.values(save.stars).reduce((a, b) => a + b, 0);
const updChip = () => {
  $('#starChip').textContent = `⭐ ${totalStars()} · 🏁 ${save.best}`;
  const f = $('#flowChip'); f.className = 'chip ' + save.flow;
  f.innerHTML = save.flow === 'e' ? '🔵 <span class="long">Showing:</span> electrons (− → +)' : '🟡 <span class="long">Showing:</span> conventional (+ → −)';
};
$('#flowChip').onclick = () => {
  save.flow = save.flow === 'e' ? 'c' : 'e'; persist(); updChip();
  if (G && $('#sv')) render();
  toast(save.flow === 'e' ? '🔵 Electrons are negative, so they flow from the − terminal, around the circuit, to the + terminal.' : '🟡 Conventional current is the direction scientists agreed on before electrons were discovered: from + to −. Circuit diagrams still use it!');
};
function toast(t){ let el = $('#toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'glass'; el.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:70;padding:12px 18px;border-radius:16px;font-weight:800;width:min(560px,calc(100% - 32px));text-align:center;transition:opacity .3s'; document.body.appendChild(el); }
  el.textContent = t; el.style.opacity = 1; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.opacity = 0, 4200); }
$('#sky').innerHTML = Array.from({length:70}, () => `<i style="left:${Math.random() * 100}%;top:${Math.random() * 60}%;animation-delay:${-Math.random() * 3}s"></i>`).join('');

/* =================================================================
   CIRCUIT SOLVER (nodal analysis on the grid)
   Wires/closed switches ≈ 0.01 Ω, buildings (bulbs) 10 Ω, power station 6 V with 0.2 Ω inside.
   ================================================================= */
const COLS = 9, ROWS = 6;
const V_BATT = 6, R_INT = 0.2, R_BULB = 10, R_WIRE = 0.01, SHORT_A = 5;
const nid = (x, y) => y * COLS + x;
const ends = e => { const [x, y, d] = e.split(','); return [[+x, +y], d === 'h' ? [+x + 1, +y] : [+x, +y + 1]]; };
function solve(parts, swState){
  const N = COLS * ROWS, bat = Object.entries(parts).find(([, p]) => p.t === 'battery');
  if (!bat) return null;
  const [, bn] = ends(bat[0]).map(([x, y]) => nid(x, y)), gnd = bn;
  const idx = i => i < gnd ? i : i - 1, n = N - 1;
  const A = Array.from({length:n}, () => new Float64Array(n + 1));
  const stamp = (a, b, g) => { if (a !== gnd) A[idx(a)][idx(a)] += g; if (b !== gnd) A[idx(b)][idx(b)] += g; if (a !== gnd && b !== gnd) { A[idx(a)][idx(b)] -= g; A[idx(b)][idx(a)] -= g; } };
  for (let i = 0; i < n; i++) A[i][i] += 1e-7;
  const cond = {};
  for (const [e, p] of Object.entries(parts)) {
    const [a, b] = ends(e).map(([x, y]) => nid(x, y)); let g = 0;
    if (p.t === 'wire') g = 1 / R_WIRE;
    else if (p.t === 'bulb') g = 1 / R_BULB;
    else if (p.t === 'switch') g = (swState && e in swState ? swState[e] : p.on) ? 1 / R_WIRE : 0;
    else if (p.t === 'battery') { g = 1 / R_INT; if (a !== gnd) A[idx(a)][n] += V_BATT / R_INT; }
    if (g) stamp(a, b, g); cond[e] = g;
  }
  for (let c = 0; c < n; c++) {
    let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    [A[c], A[p]] = [A[p], A[c]]; const d = A[c][c]; if (Math.abs(d) < 1e-14) continue;
    for (let r = c + 1; r < n; r++) { const f = A[r][c] / d; if (f) for (let k = c; k <= n; k++) A[r][k] -= f * A[c][k]; }
  }
  const x = new Float64Array(n);
  for (let r = n - 1; r >= 0; r--) { let s = A[r][n]; for (let k = r + 1; k < n; k++) s -= A[r][k] * x[k]; x[r] = Math.abs(A[r][r]) < 1e-14 ? 0 : s / A[r][r]; }
  const V = i => i === gnd ? 0 : x[idx(i)];
  const out = {cur:{}, bright:{}, Ibatt:0, short:false};
  for (const [e, p] of Object.entries(parts)) {
    const [a, b] = ends(e).map(([x, y]) => nid(x, y)), dv = V(a) - V(b);
    if (p.t === 'battery') { out.Ibatt = (V_BATT - dv) / R_INT; out.cur[e] = -out.Ibatt; } else out.cur[e] = dv * cond[e]; // + = conventional current from first end to second end
    if (p.t === 'bulb') out.bright[e] = Math.min(1.2, (dv / V_BATT) ** 2);
  }
  out.short = out.Ibatt > SHORT_A;
  if (out.short) for (const k in out.bright) out.bright[k] = 0;
  return out;
}

/* =================================================================
   DISTRICTS (levels)
   ================================================================= */
const BAT = '0,2,v';
const LEVELS = [
  {name:'Maple Street', story:'The whole city is dark! Start with one home: connect the power station to Mia\'s house.',
   hint:'Lay cable from the + side of the power station, through Mia\'s house, and back to the − side. Electricity needs a complete loop.',
   bulbs:[{e:'4,0,h', kind:'house', label:'Mia\'s house', mode:'on', col:'#f4a261'}], bright:false, switches:0, par:14,
   note:'A circuit must be a <b>complete loop</b> from one terminal of the power source back to the other. Any gap, and no current flows.'},
  {name:'Twin Cottages', story:'Two cottages on the same street. Light them both up!',
   hint:'Run one cable path through BOTH houses, one after the other.',
   bulbs:[{e:'3,0,h', kind:'house', label:'Blue cottage', mode:'on', col:'#60a5fa'}, {e:'6,0,h', kind:'house', label:'Green cottage', mode:'on', col:'#4ade80'}], bright:false, switches:0, par:17,
   note:'Both houses on ONE path are in <b>series</b>. They were <b>dim</b>: in series the buildings share the voltage, so each gets less energy.'},
  {name:'Bright Lane', story:'The residents are complaining it\'s too dim! Both homes must glow at FULL brightness.',
   hint:'Give each house its own path: one cable along the top and one along the bottom, with each house as a "rung" between them.',
   bulbs:[{e:'3,2,v', kind:'house', label:'Rosa\'s house', mode:'on', col:'#f472b6'}, {e:'6,2,v', kind:'house', label:'Kai\'s house', mode:'on', col:'#a78bfa'}], bright:true, switches:0, par:12,
   note:'Each house now has its own branch: a <b>parallel circuit</b>. Each gets the full voltage, so both glow brightly. Real homes are wired like this!'},
  {name:'Okafor Court', story:'Mr Okafor wants to switch his lights off at bedtime. Build his circuit with a switch.',
   hint:'Use the switch tool to place a switch somewhere in the loop. Tap it to open and close it!',
   bulbs:[{e:'5,2,v', kind:'house', label:'Okafor house', mode:'sw', col:'#fbbf24'}], bright:true, switches:1, par:10,
   note:'An <b>open</b> switch makes a gap, so no current flows. A <b>closed</b> switch completes the loop.'},
  {name:'Neighbour Row', story:'Two neighbours, two switches. Each family must control ONLY their own lights.',
   hint:'Top and bottom cables, with each switch in its own house\'s branch, not in the shared cable.',
   bulbs:[{e:'4,1,v', kind:'house', label:'Lee house', mode:'sw', col:'#60a5fa'}, {e:'7,1,v', kind:'house', label:'Patel house', mode:'sw', col:'#f97316'}], bright:true, switches:2, par:17,
   note:'A switch in a <b>branch</b> only controls that branch. A switch in the main line controls everything!'},
  {name:'Substation Fix', story:'Someone wired the substation wrong and it\'s overheating! Fix it and power all three houses brightly.',
   hint:'Find the cable that joins + to − with nothing in between. Erase it!',
   pre:['0,2,h', '1,2,v', '0,3,h'],
   bulbs:[{e:'3,2,v', kind:'house', label:'House 1', mode:'on', col:'#f4a261'}, {e:'5,2,v', kind:'house', label:'House 2', mode:'on', col:'#4ade80'}, {e:'7,2,v', kind:'house', label:'House 3', mode:'on', col:'#60a5fa'}], bright:true, switches:0, par:16,
   note:'A <b>short circuit</b> is an easy path with almost no resistance. A huge current rushes through it, skipping the buildings, and can overheat wires and start fires. That\'s why homes have <b>fuses</b> and <b>circuit breakers</b>.'},
  {name:'Hospital Hill', story:'The hospital must NEVER lose power. The corner shop needs its own switch.',
   hint:'Connect the hospital straight between the cables. Give the shop a switch in its own branch.',
   bulbs:[{e:'3,1,v', kind:'hospital', label:'Hospital', mode:'on', col:'#f8fafc'}, {e:'6,1,v', kind:'shop', label:'Corner shop', mode:'sw', col:'#f87171'}], bright:true, switches:1, par:15,
   note:'Parallel circuits let some buildings stay on while others are switched off. If one branch is off, the others keep working.'},
  {name:'Downtown', story:'The grand finale! Three homes with their own switches, and a street light that stays on all night.',
   hint:'Long top and bottom cables, four branches. A switch in each home\'s branch; the street light gets plain cable.',
   bulbs:[{e:'2,1,v', kind:'house', label:'Home A', mode:'sw', col:'#f472b6'}, {e:'4,1,v', kind:'house', label:'Home B', mode:'sw', col:'#60a5fa'}, {e:'6,1,v', kind:'house', label:'Home C', mode:'sw', col:'#4ade80'}, {e:'8,1,v', kind:'lamp', label:'Street light', mode:'on'}], bright:true, switches:3, par:21,
   note:'You wired a whole city like a real electrician! Homes use <b>parallel circuits</b> so every room gets full voltage and can be switched on its own.'}
];
const COST = 10; // $ per cable or switch
const budgetOf = L => Math.round(L.par * 1.4) * COST;

/* =================================================================
   ISOMETRIC DRAWING HELPERS
   ================================================================= */
const TW = 56, TH = 28, OX = 60 + (ROWS - 1) * TW, OY = 120;
const VBW = OX + (COLS - 1) * TW + 120, VBH = OY + (COLS + ROWS - 2) * TH + 70;
const P = (x, y) => [OX + (x - y) * TW, OY + (x + y) * TH];
const toGrid = (px, py) => { const u = (px - OX) / TW, v = (py - OY) / TH; return [(u + v) / 2, (v - u) / 2]; };
const diamond = (x, y, fill, extra) => { const pts = [P(x, y), P(x + 1, y), P(x + 1, y + 1), P(x, y + 1)].map(p => p.join(',')).join(' '); return `<polygon points="${pts}" fill="${fill}" ${extra || ''}/>`; };
function isoBox(cx, cy, w, d, h, top, left, right, win, glow){
  // cx,cy = ground centre; w,d = half sizes along iso axes
  const ax = w * TW / 28, ay = w * TH / 28, bx = d * TW / 28, by = d * TH / 28;
  const g = [[cx - ax + bx, cy - ay - by], [cx + ax + bx, cy + ay - by], [cx + ax - bx, cy + ay + by], [cx - ax - bx, cy - ay + by]]; // ground corners (N,E,S,W)
  const up = p => [p[0], p[1] - h];
  const poly = (pts, f) => `<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="${f}"/>`;
  let s = poly([g[3], g[2], up(g[2]), up(g[3])], left) + poly([g[2], g[1], up(g[1]), up(g[2])], right) + poly([up(g[0]), up(g[1]), up(g[2]), up(g[3])], top);
  if (win) { // windows on both visible faces
    const rows = Math.max(1, Math.floor(h / 18));
    for (let r = 0; r < rows; r++) for (let k = 0; k < 2; k++) {
      const t = (k + .5) / 2, yy = h * (r + .55) / (rows + .2);

        bld += `<polygon points="${W} ${S} ${ap}" fill="${on ? '#c2410c' : '#3f2a1a'}"/><polygon points="${S} ${E} ${ap}" fill="${on ? '#9a3412' : '#2e1f14'}"/>`; }
      if (b.kind === 'hospital') bld += `<text x="${mx}" y="${my - h - 4}" text-anchor="middle" font-size="20">🏥</text>`;
      if (b.kind === 'shop') bld += `<rect x="${mx - 18}" y="${my - h - 16}" width="36" height="12" rx="3" fill="${on ? '#f87171' : '#3b1d1d'}"/><text x="${mx}" y="${my - h - 7}" text-anchor="middle" font-size="9" font-weight="900" fill="#fff">SHOP</text>`; }
    const top = b.kind === 'hospital' ? 90 : b.kind === 'lamp' ? 74 : 82;
    return cable + (on ? `<ellipse cx="${mx}" cy="${my - 20}" rx="${40 + br * 30}" ry="${30 + br * 22}" fill="url(#glow)" opacity="${br}"/>` : '') + bld +
      `<text x="${mx}" y="${my - top}" text-anchor="middle" font-size="12" font-weight="900" fill="${on ? '#ffe98a' : '#8b93c4'}" stroke="#070b1f" stroke-width="3" paint-order="stroke">${esc(b.label)}${b.mode === 'sw' ? ' 🔘' : ''}</text>
      ${G.readings && res ? `<text x="${mx}" y="${my + 22}" text-anchor="middle" font-size="12" font-weight="900" fill="#38e1ff" stroke="#070b1f" stroke-width="3" paint-order="stroke">${Math.abs(res.cur[e] || 0).toFixed(2)} A · ${Math.round(br * 100)}%</text>` : ''}${flow}`;
  }
  return '';
}

/* =================================================================
   GOAL CHECKING (tests every switch combination)
   ================================================================= */
function check(res){
  const L = G.L, minB = L.bright ? .75 : .04;
  const sws = Object.entries(G.parts).filter(([, p]) => p.t === 'switch').map(([e]) => e);
  const combos = [];
  for (let m = 0; m < (1 << sws.length); m++) { const st = {}; sws.forEach((e, i) => st[e] = !!(m & (1 << i))); combos.push(st); }
  const runs = combos.map(st => ({st, r:solve(G.parts, st)}));
  const goals = [{t:'No short circuits', ok:!(runs.some(x => x.r.short) || res.short), i:'🔌'}];
  const used = new Set();
  L.bulbs.forEach(b => {
    const ico = b.kind === 'hospital' ? '🏥' : b.kind === 'shop' ? '🏪' : b.kind === 'lamp' ? '💡' : '🏠';
    if (b.mode === 'on') goals.push({t:`${b.label} has power${L.bright ? ' at full brightness' : ''}${sws.length ? ' (with every switch on or off)' : ''}`, ok:runs.every(x => (x.r.bright[b.e] || 0) >= minB), i:ico});
    else {
      const sw = sws.find(s => !used.has(s) && runs.every(x => x.st[s] ? (x.r.bright[b.e] || 0) >= minB : (x.r.bright[b.e] || 0) < .02));
      if (sw) used.add(sw);
      goals.push({t:`${b.label} has its OWN switch${L.bright ? ' and glows brightly when on' : ''}`, ok:!!sw, i:ico});
    }
  });
  $('#goals').innerHTML = goals.map(g => `<li class="${g.ok ? 'ok' : ''}"><span>${g.ok ? '✅' : g.i}</span><span>${esc(g.t)}</span></li>`).join('');
  const msg = $('#msg');
  if (res.short) msg.innerHTML = '<div class="msg bad">💥 SHORT CIRCUIT! The current is taking a shortcut straight between the + and − terminals without going through any buildings. The station is overheating! Find the shortcut cable and remove it.</div>';
  else if (L.bright && L.bulbs.some(b => { const v = res.bright[b.e] || 0; return v > .04 && v < .75; })) msg.innerHTML = '<div class="msg info">🔅 Some buildings have power but are <b>dim</b>. Buildings on one path (series) share the voltage. Try giving each its own branch.</div>';
  else if (msg.textContent.startsWith('🔅') || msg.textContent.startsWith('💥')) msg.innerHTML = '';
  if (goals.every(g => g.ok) && !G.won) { G.won = true; const g0 = G; setTimeout(() => { if (G === g0 && $('#sv')) win(); }, REDUCED ? 100 : 1100); }
}
function win(){
  const spent = userParts() * COST, par = G.L.par * COST, stars = spent <= par ? 3 : spent <= budgetOf(G.L) ? 2 : 1;
  save.stars[G.li] = Math.max(save.stars[G.li] || 0, stars); persist(); updChip();
  const last = G.li === LEVELS.length - 1;
  modal(`<h2>${last ? 'THE CITY IS ALIVE!' : 'DISTRICT POWERED!'}</h2><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
    <div style="font-weight:800;color:var(--ink2)">You spent $${spent} (an expert would spend $${par}).${stars < 3 ? ' Use fewer parts for more stars!' : ' Perfect efficiency!'}</div>
    <div class="note">🔬 <b>Engineer's note:</b> ${G.L.note}</div>
    <div class="row" style="justify-content:center"><button class="btn" data-a="stay">🔦 Keep exploring</button><button class="btn" data-a="map">🏙️ See the city</button>${last ? '<button class="btn volt" data-a="sprint">🔄 Circuit Sprint</button>' : '<button class="btn volt" data-a="next">Next district ▸</button>'}</div>`,
    a => a === 'stay' ? null : a === 'map' ? title() : a === 'sprint' ? sprint() : play(G.li + 1));
  confetti();
}
function modal(html, cb){
  const m = $('#modal'); m.innerHTML = `<div class="card glass">${html}</div>`; m.classList.remove('hidden');
  m.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { m.classList.add('hidden'); cb(b.dataset.a); });
}
function confetti(){
  if (REDUCED) return;
  for (let i = 0; i < 30; i++) { const s = document.createElement('span'); s.textContent = ['⚡','💡','✨','⭐','🎉'][i % 5];
    s.style.cssText = `position:fixed;z-index:60;left:${Math.random() * 100}vw;top:-30px;font-size:1.6rem;pointer-events:none;transition:transform ${2 + Math.random() * 2}s linear`;
    document.body.appendChild(s); requestAnimationFrame(() => { s.style.transform = `translateY(110vh) rotate(${Math.random() * 600}deg)`; }); setTimeout(() => s.remove(), 4200); }
}

/* =================================================================
   CIRCUIT SPRINT (tile-rotation arcade)
   ================================================================= */
const N_ = 1, E_ = 2, S_ = 4, W_ = 8;
const rotM = (m, k) => { for (let i = 0; i < ((k % 4) + 4) % 4; i++) m = ((m << 1) | (m >> 3)) & 15; return m; };
const DIR = {U:[0,-1], D:[0,1], R:[1,0], L:[-1,0]};
const LAYOUTS = [
  {n:5, s:[0,2], m:'UURRRRDDDDLLLLUU', bulbs:[4,9,12]},
  {n:5, s:[0,3], m:'UUURDDRRUURDDDDLLLLU', bulbs:[5,13,17]},
  {n:6, s:[0,3], m:'UUURRDDRRUURDDDDDLLLLLUU', bulbs:[6,14,19]},
  {n:6, s:[0,3], m:'UUURRRRRDDLLLLDDRRRRDLLLLLUU', bulbs:[5,12,18,24]}
];
let SP = null;
function stopSprint(){ if (SP) { clearInterval(SP.timer); SP = null; } }
function makePuzzle(level){
  const Lo = LAYOUTS[level < 2 ? level % 2 : 2 + (level % 2)], n = Lo.n;
  let pos = [Lo.s.slice()];
  for (const c of Lo.m.slice(0, -1)) { const [dx, dy] = DIR[c], p = pos[pos.length - 1]; pos.push([p[0] + dx, p[1] + dy]); }
  const t = Math.floor(Math.random() * 8);
  pos = pos.map(([x, y]) => { for (let k = 0; k < t % 4; k++) [x, y] = [n - 1 - y, x]; if (t >= 4) x = n - 1 - x; return [x, y]; });
  const dirTo = (a, b) => b[0] > a[0] ? E_ : b[0] < a[0] ? W_ : b[1] > a[1] ? S_ : N_;
  const grid = Array.from({length:n * n}, () => null);
  pos.forEach((p, i) => { const prev = pos[(i - 1 + pos.length) % pos.length], next = pos[(i + 1) % pos.length];
    grid[p[1] * n + p[0]] = {base:dirTo(p, prev) | dirTo(p, next), path:true, kind:i === 0 ? 'bat' : Lo.bulbs.includes(i) ? 'bulb' : ''}; });
  const extras = [N_ | S_, N_ | E_, N_ | E_ | S_, N_ | E_ | S_ | W_];
  grid.forEach((g, i) => { if (!g) grid[i] = {base:extras[Math.floor(Math.random() * extras.length)], path:false, kind:''}; });
  grid.forEach(g => { const straight = g.base === (N_ | S_) || g.base === (E_ | W_); g.rot = g.path ? (straight ? [1, 3][Math.floor(Math.random() * 2)] : 1 + Math.floor(Math.random() * 3)) : Math.floor(Math.random() * 4); });
  return {n, grid};
}
function tileSVG(g){
  const m = g.base, seg = [];
  if (m & N_) seg.push('M50 50 L50 0'); if (m & E_) seg.push('M50 50 L100 50'); if (m & S_) seg.push('M50 50 L50 100'); if (m & W_) seg.push('M50 50 L0 50');
  let mid = '';
  if (g.kind === 'bat') mid = '<rect x="30" y="34" width="40" height="32" rx="6" fill="#1e2a5e" stroke="#ffd60a" stroke-width="4"/><text x="50" y="57" text-anchor="middle" font-size="18" font-weight="900" fill="#ffd60a">⚡</text>';
  else if (g.kind === 'bulb') mid = '<circle cx="50" cy="50" r="18" class="bulbc" fill="#151b3f" stroke="#3a4380" stroke-width="4"/>';
  else if (seg.length) mid = '<circle cx="50" cy="50" r="9" fill="#5b6bd6"/>';
  return `<svg viewBox="0 0 100 100" style="transform:rotate(${g.rot * 90}deg)"><path class="ln" d="${seg.join(' ')}"/>${mid}</svg>`;
}
function sprint(){
  stopSprint(); G = null;
  SP = {level:0, score:0, time:60, timer:null, puzzle:null, busy:false};
  $('#main').innerHTML = `<div class="sprint glass"><div class="shud"><button class="btn small" id="back">← City</button><span class="big">🏁 <span id="sc">0</span></span><span class="big t">⏱ <span id="tm">60</span>s</span></div>
    <div class="tbar"><i id="tb" style="width:100%"></i></div><div class="tiles" id="tiles"></div>
    <p style="text-align:center;color:var(--ink2);font-weight:800;margin:12px 0 0" id="sh">Tap tiles to spin them. Connect the ⚡ battery through every 💡 bulb and back in one loop!</p>
    <div style="text-align:center;margin-top:10px"><button class="btn volt" id="go">▶ Start</button></div></div>`;
  $('#back').onclick = title;
  const draw = () => {
    const Pz = SP.puzzle; $('#tiles').style.gridTemplateColumns = `repeat(${Pz.n},1fr)`;
    $('#tiles').innerHTML = Pz.grid.map((g, i) => `<button class="tile" data-i="${i}" aria-label="tile">${tileSVG(g)}</button>`).join('');
    $('#tiles').querySelectorAll('.tile').forEach(b => b.onclick = () => spin(+b.dataset.i, b));
  };
  const complete = Pz => {
    const n = Pz.n, eff = i => rotM(Pz.grid[i].base, Pz.grid[i].rot), opp = {1:4, 4:1, 2:8, 8:2}, step = {1:[0,-1], 2:[1,0], 4:[0,1], 8:[-1,0]};
    const start = Pz.grid.findIndex(t => t.kind === 'bat'), seen = new Set([start]), stack = [start];
    while (stack.length) {
      const i = stack.pop(), x = i % n, y = Math.floor(i / n), m = eff(i);
      for (const d of [1, 2, 4, 8]) { if (!(m & d)) continue;
        const nx = x + step[d][0], ny = y + step[d][1]; if (nx < 0 || ny < 0 || nx >= n || ny >= n) return false;
        const j = ny * n + nx; if (!(eff(j) & opp[d])) return false;
        if (!seen.has(j)) { seen.add(j); stack.push(j); } }
    }
    return Pz.grid.every((t, i) => t.kind !== 'bulb' || seen.has(i));
  };
  const spin = (i, b) => {
    if (!SP || SP.busy || SP.time <= 0) return;
    const g = SP.puzzle.grid[i]; g.rot++;
    b.querySelector('svg').style.transform = `rotate(${g.rot * 90}deg)`;
    if (complete(SP.puzzle)) solved();
  };
  const solved = async () => {
    const bonus = Math.max(4, 12 - SP.level * 2);
    SP.busy = true; SP.score++; SP.time = Math.min(90, SP.time + bonus); $('#sc').textContent = SP.score;
    SP.puzzle.grid.forEach((g, i) => { if (g.path) { const t = $('#tiles').children[i]; t.classList.add('lit'); const c = t.querySelector('.bulbc'); if (c) { c.setAttribute('fill', '#ffe066'); c.setAttribute('stroke', '#ffd60a'); c.style.filter = 'drop-shadow(0 0 10px #ffd60a)'; } } });
    $('#sh').textContent = `⚡ Circuit complete! +${bonus} seconds`;
    await new Promise(r => setTimeout(r, REDUCED ? 200 : 900));
    if (!SP) return;
    SP.level++; SP.puzzle = makePuzzle(SP.level); SP.busy = false; draw();
    $('#sh').textContent = SP.level >= 2 ? 'Bigger grid! Ignore the spare tiles. Only the loop matters.' : 'Next circuit!';
  };
  $('#go').onclick = () => {
    $('#go').classList.add('hidden'); SP.puzzle = makePuzzle(0); draw();
    SP.timer = setInterval(() => {
      if (!SP) return; SP.time = Math.max(0, SP.time - .25);
      $('#tm').textContent = Math.ceil(SP.time); $('#tb').style.width = Math.min(100, SP.time / 60 * 100) + '%';
      if (SP.time <= 0) {
        clearInterval(SP.timer); const newBest = SP.score > save.best; if (newBest) { save.best = SP.score; persist(); updChip(); }
        modal(`<h2>TIME'S UP!</h2><div class="stars">🏁 ${SP.score}</div><div style="font-weight:800;color:var(--ink2)">${SP.score === 1 ? 'circuit' : 'circuits'} powered${newBest ? ' · <span style="color:#ffd60a">NEW BEST!</span>' : ` · best ${save.best}`}</div>
          <div class="note">🔬 <b>Engineer's note:</b> Every puzzle was a <b>series circuit</b>: one single loop. If even one tile is turned the wrong way, the loop is broken and <b>nothing</b> lights up. That's why old-style Christmas lights all went out when one bulb failed!</div>
          <div class="row" style="justify-content:center"><button class="btn" data-a="menu">🏙️ City</button><button class="btn volt" data-a="again">↺ Play again</button></div>`, a => a === 'again' ? sprint() : title());
      }
    }, 250);
  };
}

$('#home').onclick = title;
window.__sprintState = () => SP; // used only for automated testing
updChip(); title();
})();
</script>
</body>
</html>
